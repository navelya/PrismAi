name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'python-backend/**'

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd python-backend
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git init
          git add .
          git commit -m "Sync from GitHub: ${{ github.sha }}"
          git remote add hf https://navelya:$HF_TOKEN@huggingface.co/spaces/navelya/prismai-backend
          git push hf main --force
