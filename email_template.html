<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Account</title>
</head>

<body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f9fafb;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">

        <!-- Card -->
        <div
            style="background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); overflow: hidden;">

            <!-- Header -->
            <div
                style="background: linear-gradient(135deg, #a855f7 0%, #4f46e5 100%); padding: 32px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 700;">Prism AI</h1>
            </div>

            <!-- Body -->
            <div style="padding: 32px; text-align: center;">
                <h2 style="color: #111827; margin-top: 0; margin-bottom: 16px; font-size: 20px;">Welcome aboard!</h2>

                <p style="color: #4b5563; margin-bottom: 24px; font-size: 16px;">
                    You just signed up for Prism AI. Please click the button below to confirm your email address and
                    activate your account.
                </p>

                <a href="{{ .ConfirmationURL }}"
                    style="display: inline-block; background: linear-gradient(135deg, #a855f7 0%, #4f46e5 100%); color: #ffffff; text-decoration: none; padding: 12px 32px; border-radius: 9999px; font-weight: 600; font-size: 16px; margin: 16px 0;">
                    Confirm Email
                </a>

                <p style="color: #6b7280; font-size: 14px; margin-top: 24px;">
                    If you didn't create an account, you can safely ignore this email.
                </p>
            </div>

            <!-- Footer -->
            <div style="background-color: #f3f4f6; padding: 24px; text-align: center;">
                <p style="color: #9ca3af; font-size: 12px; margin: 0;">
                    &copy; 2024 Prism AI. All rights reserved.
                </p>
            </div>

        </div>
    </div>
</body>

</html>
